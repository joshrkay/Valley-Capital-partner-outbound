# The platform worker (PRD E12-S4, E11-S1). Runs queued jobs (data pulls, scoring, research, drafting) and queues the weekly FDIC
# check, the monthly CMBS pull and the daily SEC filings listener, and verifies each against its source. Off until the platform exists: set the repository variable PLATFORM_ENABLED to "true", and the secrets SUPABASE_URL,
# SUPABASE_SERVICE_ROLE_KEY and ANTHROPIC_API_KEY. The worker prints job ids, kinds and outcomes only; it never prints names, figures
# or message text, and this workflow uploads no artifacts. A job queued from the web app waits for the next hourly run.
name: platform worker

on:
  schedule:
    - cron: '17 12-23 * * 1-5'   # hourly on weekdays, 12:17 to 23:17 UTC: run whatever is queued
    - cron: '41 13 * * 1'        # Mondays 13:41 UTC: queue the weekly check for a new FDIC quarter, then verify the FDIC data
    - cron: '23 14 20 * *'       # the 20th, 14:23 UTC: queue the monthly CMBS pull (most trusts have filed by then), then verify it
    - cron: '37 23 * * 1-5'      # weekdays 23:37 UTC, after EDGAR's filing day: queue the SEC filings listener, then verify it.
                                 # Only once a principal sets the repository variable FILINGS_ENABLED to "true" (after filling the SEC contact
                                 # and confirming filers), so an unconfigured listener does not turn every run red.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-worker
  cancel-in-progress: false

jobs:
  work:
    if: ${{ vars.PLATFORM_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Queue the weekly FDIC check
        if: ${{ github.event.schedule == '41 13 * * 1' }}
        run: node cli.mjs enqueue sources.fdic
      - name: Queue the monthly CMBS pull
        if: ${{ github.event.schedule == '23 14 20 * *' }}
        run: node cli.mjs enqueue sources.edgar
      - name: Queue the daily SEC filings listener
        if: ${{ github.event.schedule == '37 23 * * 1-5' && vars.FILINGS_ENABLED == 'true' }}
        run: node cli.mjs enqueue sources.filings
      - name: Run queued jobs
        run: node cli.mjs worker --max 20
      # The scraper checks (src/sources/verify.mjs): read-only, and a failure turns this run red, which is the alert. Here they print
      # check results only (counts, no names): `platform verify` leaves out the spot-check list unless --sample is given.
      - name: Verify the FDIC data
        if: ${{ github.event.schedule == '41 13 * * 1' }}
        run: node cli.mjs platform verify fdic
      - name: Verify the CMBS data
        if: ${{ github.event.schedule == '23 14 20 * *' }}
        run: node cli.mjs platform verify edgar
      - name: Verify the SEC filings
        if: ${{ github.event.schedule == '37 23 * * 1-5' && vars.FILINGS_ENABLED == 'true' }}
        run: node cli.mjs platform verify filings
