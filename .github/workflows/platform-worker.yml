# The platform worker (PRD E12-S4, E11-S1). Runs queued jobs (data pulls, scoring, research, drafting) and queues the weekly FDIC
# check (then scoring and the weekly triage, PRD E6-S5), the monthly CMBS pull, the monthly enforcement orders, the weekly merger
# applications and the daily SEC filings listener, and verifies each against its source. Off until the platform exists: set the repository variable PLATFORM_ENABLED to
# "true", and the secrets SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY and ANTHROPIC_API_KEY. The worker prints job ids, kinds and outcomes
# only; it never prints names, figures or message text, and this workflow uploads no artifacts. A job queued from the web app waits
# for the next hourly run.
name: platform worker

on:
  schedule:
    - cron: '17 12-23 * * 1-5'   # hourly on weekdays, 12:17 to 23:17 UTC: run whatever is queued
    - cron: '41 13 * * 1'        # Mondays 13:41 UTC: queue the weekly check for a new FDIC quarter, then scoring and the weekly triage,
                                 # run them in that order, then verify the FDIC data
    - cron: '23 14 20 * *'       # the 20th, 14:23 UTC: queue the monthly CMBS pull (most trusts have filed by then), then verify it
    - cron: '53 15 * * 3'        # Wednesdays 15:53 UTC: queue the FDIC loan-sale announcements pull (PRD E16), which rebuilds the sale
                                 # ledger. Only once a principal sets the repository variable FDICSALES_ENABLED to "true" (after filling
                                 # config.fdic.userAgent), so an unconfigured pull does not turn the run red.
    - cron: '29 16 3 * *'        # the 3rd, 16:29 UTC: queue the monthly enforcement-orders pull (PRD next-five E18-S2; the Federal Reserve's
                                 # action files, no key needed), then verify it. Scoring the next Monday shows the new orders.
    - cron: '19 15 * * 6'        # Saturdays 15:19 UTC: queue the weekly merger-applications pull (PRD next-five E18-S3; the Federal Reserve's
                                 # H.2 for the week ended that day is usually out by Thursday), then verify it. Monday's scoring shows them.
    - cron: '37 23 * * 1-5'      # weekdays 23:37 UTC, after EDGAR's filing day: queue the SEC filings listener, then verify it.
                                 # Only once a principal sets the repository variable FILINGS_ENABLED to "true" (after filling the SEC contact
                                 # and confirming filers), so an unconfigured listener does not turn every run red.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-worker
  cancel-in-progress: false

jobs:
  work:
    if: ${{ vars.PLATFORM_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Queue the weekly FDIC check
        if: ${{ github.event.schedule == '41 13 * * 1' }}
        run: node cli.mjs enqueue sources.fdic
      # The weekly triage (PRD E6-S5) compares the candidate list with last week's, so scoring runs between the FDIC check and the
      # triage: a new quarter's tiers and signals are then in this week's comparison. Jobs run oldest first. Scoring uses
      # --draft-buybox, which matters only while buybox.json still has [CONFIRM] placeholders: the list is then labelled PROVISIONAL,
      # instead of the job failing every Monday and the failed worker step skipping the FDIC checks below. Set the repository variable
      # SCORING_STRICT to "true" to make the weekly scoring refuse instead, as `outbound score run` does. The triage is written to the
      # platform only, for the principals; it is never sent.
      - name: Queue scoring and the weekly triage, after the FDIC check
        if: ${{ github.event.schedule == '41 13 * * 1' }}
        run: |
          node cli.mjs enqueue score.run ${{ vars.SCORING_STRICT != 'true' && '--draft-buybox' || '' }}
          node cli.mjs enqueue triage.run
      - name: Queue the monthly CMBS pull
        if: ${{ github.event.schedule == '23 14 20 * *' }}
        run: node cli.mjs enqueue sources.edgar
      - name: Queue the monthly enforcement-orders pull
        if: ${{ github.event.schedule == '29 16 3 * *' }}
        run: node cli.mjs enqueue sources.enforcement
      - name: Queue the weekly merger-applications pull
        if: ${{ github.event.schedule == '19 15 * * 6' }}
        run: node cli.mjs enqueue sources.mergerapps
      - name: Queue the weekly FDIC loan-sale pull
        if: ${{ github.event.schedule == '53 15 * * 3' && vars.FDICSALES_ENABLED == 'true' }}
        run: node cli.mjs enqueue sources.fdicsales
      - name: Queue the daily SEC filings listener
        if: ${{ github.event.schedule == '37 23 * * 1-5' && vars.FILINGS_ENABLED == 'true' }}
        run: node cli.mjs enqueue sources.filings
      - name: Run queued jobs
        run: node cli.mjs worker --max 20
      # The scraper checks (src/sources/verify.mjs): read-only, and a failure turns this run red, which is the alert. Here they print
      # check results only (counts, no names): `platform verify` leaves out the spot-check list unless --sample is given.
      - name: Verify the FDIC data
        if: ${{ github.event.schedule == '41 13 * * 1' }}
        run: node cli.mjs platform verify fdic
      - name: Verify the CMBS data
        if: ${{ github.event.schedule == '23 14 20 * *' }}
        run: node cli.mjs platform verify edgar
      - name: Verify the enforcement orders
        if: ${{ github.event.schedule == '29 16 3 * *' }}
        run: node cli.mjs platform verify enforcement
      - name: Verify the merger applications
        if: ${{ github.event.schedule == '19 15 * * 6' }}
        run: node cli.mjs platform verify mergerapps
      - name: Verify the SEC filings
        if: ${{ github.event.schedule == '37 23 * * 1-5' && vars.FILINGS_ENABLED == 'true' }}
        run: node cli.mjs platform verify filings
